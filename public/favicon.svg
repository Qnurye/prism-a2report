<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0000"/>
      <stop offset="20%" style="stop-color:#ff7f00"/>
      <stop offset="40%" style="stop-color:#ffff00"/>
      <stop offset="60%" style="stop-color:#00ff00"/>
      <stop offset="80%" style="stop-color:#0000ff"/>
      <stop offset="100%" style="stop-color:#8b00ff"/>
    </linearGradient>
  </defs>
  <!-- White light beam -->
  <path d="M 10 50 L 40 35 L 40 65 Z" fill="#ffffff" opacity="0.8"/>
  <!-- Prism -->
  <path d="M 40 35 L 70 50 L 40 65 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Spectrum rays -->
  <path d="M 70 50 L 90 30" stroke="url(#spectrum)" stroke-width="3" opacity="0.9"/>
  <path d="M 70 50 L 90 40" stroke="url(#spectrum)" stroke-width="3" opacity="0.9"/>
  <path d="M 70 50 L 90 50" stroke="url(#spectrum)" stroke-width="3" opacity="0.9"/>
  <path d="M 70 50 L 90 60" stroke="url(#spectrum)" stroke-width="3" opacity="0.9"/>
  <path d="M 70 50 L 90 70" stroke="url(#spectrum)" stroke-width="3" opacity="0.9"/>
</svg>
